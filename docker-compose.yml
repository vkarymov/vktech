services:
  vktech_frontend:
    build: ./frontend
    container_name: vktech_frontend
    restart: unless-stopped
    expose: ["80"]
  vktech_api:
    build: ./backend
    container_name: vktech_api
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL must be set in the ignored .env file}
    depends_on:
      vktech_db:
        condition: service_healthy
    expose: ["8000"]
  vktech_db:
    image: postgres:16-alpine
    container_name: vktech_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB must be set in the ignored .env file}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER must be set in the ignored .env file}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in the ignored .env file}
    volumes: [vktech_postgres:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vktech -d vktech"]
      interval: 5s
      timeout: 3s
      retries: 20
  vktech_nginx:
    image: nginx:alpine
    container_name: vktech_nginx
    restart: unless-stopped
    ports: ["8081:80"]
    volumes: [./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro]
    depends_on: [vktech_frontend, vktech_api]
volumes:
  vktech_postgres:
